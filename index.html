<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Monitoring Kualitas Air</title>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin-bottom: 20px;
    }
    .status {
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      color: white;
      text-align: center;
    }
    .aman { background: green; }
    .waspada { background: orange; }
    .bahaya { background: red; }
    button {
      padding: 10px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>📡 Monitoring Kualitas Air (Realtime)</h2>

<div class="card">
  <p>🌡 Suhu: <span id="suhu">-</span> °C</p>
  <p>🧪 pH: <span id="ph">-</span></p>
  <p>💧 TDS: <span id="tds">-</span> ppm</p>
  <p>⏱ Update: <span id="waktu">-</span></p>

  <div id="status" class="status">MENUNGGU DATA</div>
</div>

<button onclick="exportCSV()">⬇️ Export CSV</button>

<script>
  // 🔥 GANTI SESUAI FIREBASE KAMU
  const firebaseConfig = {
    apiKey: "AIzaSyAqrcy4kG9c8Os6uodLSJstNR_6e6VhHYc",
    authDomain: "monitoring-kolam-ikan-b1c16.firebaseapp.com",
    databaseURL: "https://monitoring-kolam-ikan-b1c16-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "monitoring-kolam-ikan-b1c16",
    storageBucket: "monitoring-kolam-ikan-b1c16.firebasestorage.app",
    messagingSenderId: "522306586334",
    appId: "1:522306586334:web:cabf4a21b9707bb5a8e44f"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let dataLog = [];

  db.ref("monitoring").on("value", snapshot => {
    const data = snapshot.val();
    if (!data) return;

    document.getElementById("suhu").innerText = data.suhu;
    document.getElementById("ph").innerText = data.ph;
    document.getElementById("tds").innerText = data.tds;
    document.getElementById("waktu").innerText = data.waktu;

    let statusText = "AMAN";
    let statusClass = "aman";

    if (data.ph < 6.5 || data.ph > 8.5 || data.tds > 1000) {
      statusText = "BAHAYA";
      statusClass = "bahaya";
    } else if (data.tds > 600) {
      statusText = "WASPADA";
      statusClass = "waspada";
    }

    const statusDiv = document.getElementById("status");
    statusDiv.innerText = statusText;
    statusDiv.className = "status " + statusClass;

    dataLog.push({
      waktu: data.waktu,
      suhu: data.suhu,
      ph: data.ph,
      tds: data.tds,
      status: statusText
    });
  });

  function exportCSV() {
    let csv = "Waktu,Suhu,pH,TDS,Status\n";
    dataLog.forEach(d => {
      csv += `${d.waktu},${d.suhu},${d.ph},${d.tds},${d.status}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "monitoring_kolam.csv";
    a.click();
  }
</script>

</body>
</html>
