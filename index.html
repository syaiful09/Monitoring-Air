<!DOCTYPE html>
<html>
<head>
  <title>Monitoring Kolam Ikan</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>📊 Monitoring Kolam Ikan</h2>

<p>Suhu: <b id="suhu">-</b> °C</p>
<p>pH: <b id="ph">-</b></p>
<p>TDS: <b id="tds">-</b> ppm</p>
<p>Status: <span id="status">-</span></p>

<canvas id="grafik" width="400" height="200"></canvas>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqrcy4kG9c8Os6uodLSJstNR_6e6VhHYc",
    databaseURL: "https://monitoring-kolam-ikan-b1c16-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const monitoringRef = ref(db, "monitoring");

  const ctx = document.getElementById('grafik');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'TDS (ppm)',
        data: [],
        borderWidth: 2
      }]
    }
  });

  onValue(monitoringRef, (snapshot) => {
    const data = snapshot.val();

    document.getElementById("suhu").innerHTML = data.suhu;
    document.getElementById("ph").innerHTML = data.ph;
    document.getElementById("tds").innerHTML = data.tds;

    // grafik realtime
    const time = new Date().toLocaleTimeString();
    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(data.tds);

    if (chart.data.labels.length > 10) {
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
    }
    chart.update();

    updateStatus(data);
  });

  function updateStatus(data){
    const statusEl = document.getElementById("status");

    if (data.ph < 6.5 || data.ph > 8.5 || data.tds > 1000) {
      statusEl.innerHTML = "⚠️ TIDAK AMAN";
      statusEl.style.color = "red";
    } else {
      statusEl.innerHTML = "✅ AMAN";
      statusEl.style.color = "green";
    }
  }
</script>

</body>
</html>
