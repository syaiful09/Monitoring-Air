<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Monitoring Kualitas Air</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin-bottom: 20px;
    }
    .status {
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      color: white;
      text-align: center;
    }
    .aman { background: green; }
    .waspada { background: orange; }
    .bahaya { background: red; }
    canvas {
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>📡 Monitoring Kualitas Air (Realtime)</h2>

<div class="card">
  <p>🌡 Suhu: <span id="suhu">-</span> °C</p>
  <p>🧪 pH: <span id="ph">-</span></p>
  <p>💧 TDS: <span id="tds">-</span> ppm</p>
  <p>⏱ Update: <span id="waktu">-</span></p>

  <div id="status" class="status">MENUNGGU DATA</div>
</div>

<canvas id="suhuChart"></canvas>
<canvas id="phChart"></canvas>
<canvas id="tdsChart"></canvas>

<button onclick="exportCSV()">⬇️ Export CSV</button>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAqrcy4kG9c8Os6uodLSJstNR_6e6VhHYc",
    authDomain: "monitoring-kolam-ikan-b1c16.firebaseapp.com",
    databaseURL: "https://monitoring-kolam-ikan-b1c16-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "monitoring-kolam-ikan-b1c16",
    storageBucket: "monitoring-kolam-ikan-b1c16.firebasestorage.app",
    messagingSenderId: "522306586334",
    appId: "1:522306586334:web:cabf4a21b9707bb5a8e44f"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let labels = [];
  let suhuData = [];
  let phData = [];
  let tdsData = [];
  let dataLog = [];

  const createChart = (ctx, label, data, color) => {
    return new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: label,
          data: data,
          borderColor: color,
          fill: false,
          tension: 0.3
        }]
      }
    });
  };

  const suhuChart = createChart(
    document.getElementById("suhuChart"),
    "Suhu (°C)",
    suhuData,
    "red"
  );

  const phChart = createChart(
    document.getElementById("phChart"),
    "pH",
    phData,
    "green"
  );

  const tdsChart = createChart(
    document.getElementById("tdsChart"),
    "TDS (ppm)",
    tdsData,
    "blue"
  );

  db.ref("monitoring").on("value", snapshot => {
    const data = snapshot.val();
    if (!data) return;

    const time = new Date().toLocaleTimeString();

    document.getElementById("suhu").innerText = data.suhu;
    document.getElementById("ph").innerText = data.ph;
    document.getElementById("tds").innerText = data.tds;
    document.getElementById("waktu").innerText = time;

    let statusText = "AMAN";
    let statusClass = "aman";

    if (data.ph < 6.5 || data.ph > 8.5 || data.tds > 1000) {
      statusText = "BAHAYA";
      statusClass = "bahaya";
    } else if (data.tds > 600) {
      statusText = "WASPADA";
      statusClass = "waspada";
    }

    const statusDiv = document.getElementById("status");
    statusDiv.innerText = statusText;
    statusDiv.className = "status " + statusClass;

    if (labels.length > 20) {
      labels.shift();
      suhuData.shift();
      phData.shift();
      tdsData.shift();
    }

    labels.push(time);
    suhuData.push(data.suhu);
    phData.push(data.ph);
    tdsData.push(data.tds);

    suhuChart.update();
    phChart.update();
    tdsChart.update();

    dataLog.push({ waktu: time, ...data, status: statusText });
  });

  function exportCSV() {
    let csv = "Waktu,Suhu,pH,TDS,Status\n";
    dataLog.forEach(d => {
      csv += `${d.waktu},${d.suhu},${d.ph},${d.tds},${d.status}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "monitoring_kolam.csv";
    a.click();
  }
</script>

</body>
</html>
